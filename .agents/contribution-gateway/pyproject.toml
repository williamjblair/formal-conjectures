[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-contribution-gateway"
version = "0.1.0"
description = "Evidence-gated contribution packets for Formal Conjectures"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fc-contribution = "fc_contribution.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
