name: Advisory external PR review
run-name: Advisory review of ${{ inputs.owner }}/${{ inputs.repository }}#${{ inputs.pull_request }} at ${{ inputs.expected_head }}

on:
  workflow_dispatch:
    inputs:
      owner:
        description: GitHub owner of the pull request's base repository
        required: true
        type: string
      repository:
        description: GitHub base repository name
        required: true
        type: string
      pull_request:
        description: Pull request number
        required: true
        type: string
      expected_head:
        description: Exact 40-character pull request head commit OID
        required: true
        type: string
      request_path:
        description: Retained review-request path on this trusted branch
        required: true
        default: audit/pr-audit-v1/fixtures/fork-dogfood-erdos-430-2/review-request.json
        type: string
      actionable_review_path:
        description: Exact-head actionable projection configuration on this trusted branch
        required: true
        default: audit/pr-audit-v1/fixtures/fork-dogfood-erdos-430-2/actionable-review.json
        type: string
      build_target:
        description: Exact Lean module target for lake --wfail build
        required: true
        default: FormalConjectures.ErdosProblems.«430»
        type: string
      publish_comment:
        description: Publish the opt-in App summary and high-confidence inline suggestion
        required: true
        default: false
        type: boolean

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: advisory-external-pr-${{ inputs.owner }}-${{ inputs.repository }}-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  fast-review:
    name: Fast source, semantic, and suggestion lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out trusted review implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false
      - name: Read current pull request state
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          mkdir -p fast-evidence
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > fast-evidence/live-pr.json
      - name: Check out the exact untrusted pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          fetch-depth: 0
          path: review-target
          persist-credentials: false
      - name: Refuse a changed head or mismatched request
        env:
          PYTHONPATH: reviewer/scripts
          REQUEST: ${{ inputs.request_path }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          python3 -B reviewer/scripts/prepare_external_pr_action.py bind \
            --request "reviewer/${REQUEST}" --live-pr fast-evidence/live-pr.json \
            --owner "$OWNER" --repository "$REPOSITORY" --pull-request "$PULL_REQUEST" \
            --expected-head "$EXPECTED_HEAD" --checked-out-head "$(git -C review-target rev-parse HEAD)" \
            --output fast-evidence/workflow-binding.json
      - name: Validate isolated semantic evidence
        env:
          PYTHONPATH: reviewer/scripts
          REQUEST: ${{ inputs.request_path }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          python3 -B reviewer/scripts/run_external_pr_review.py \
            --request "reviewer/${REQUEST}" --observed-head "$EXPECTED_HEAD" --output-dir action-output
      - name: Render review-in-progress summary and suggestion
        id: metadata
        env:
          PYTHONPATH: reviewer/scripts
          ACTIONABLE: ${{ inputs.actionable_review_path }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          artifact_name="advisory-fast-pr-${PULL_REQUEST}-${EXPECTED_HEAD}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          python3 -B reviewer/scripts/prepare_external_pr_comment.py render \
            --core action-output/audit-core.json --actionable "reviewer/${ACTIONABLE}" --source-root review-target \
            --summary-output action-output/pr-comment-ready.md --summary-payload action-output/pr-comment-request.json \
            --inline-output action-output/inline-review-comment-ready.md \
            --inline-create-payload action-output/inline-review-create-request.json \
            --inline-update-payload action-output/inline-review-update-request.json \
            --metadata-output action-output/actionable-review-metadata.json \
            --expected-head "$EXPECTED_HEAD" --run-url "$RUN_URL" --artifact-name "$artifact_name" \
            --phase in-progress
      - name: Upload fast advisory artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            fast-evidence/
            action-output/
          retention-days: 14

  deterministic:
    name: Slow deterministic Lean lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out trusted review implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false
      - name: Read current pull request state
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          mkdir -p deterministic-evidence
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > deterministic-evidence/live-pr.json
      - name: Check out the exact untrusted pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          fetch-depth: 0
          path: review-target
          persist-credentials: false
      - name: Refuse a changed head or mismatched request
        env:
          PYTHONPATH: reviewer/scripts
          REQUEST: ${{ inputs.request_path }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          python3 -B reviewer/scripts/prepare_external_pr_action.py bind \
            --request "reviewer/${REQUEST}" --live-pr deterministic-evidence/live-pr.json \
            --owner "$OWNER" --repository "$REPOSITORY" --pull-request "$PULL_REQUEST" \
            --expected-head "$EXPECTED_HEAD" --checked-out-head "$(git -C review-target rev-parse HEAD)" \
            --output deterministic-evidence/workflow-binding.json
      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run typed deterministic checks
        env:
          PYTHONPATH: reviewer/scripts
          REQUEST: ${{ inputs.request_path }}
          BUILD_TARGET: ${{ inputs.build_target }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set +e
          (cd review-target && lake exe cache get && lake --wfail build "$BUILD_TARGET") \
            > deterministic-evidence/lean-build.log 2>&1
          build_exit=$?
          base_oid=$(python3 -c 'import json; print(json.load(open("deterministic-evidence/live-pr.json"))["base"]["sha"])')
          git -C review-target diff --check "$base_oid...$EXPECTED_HEAD" \
            > deterministic-evidence/diff-check.log 2>&1
          style_exit=$?
          set -e
          python3 -B reviewer/scripts/prepare_external_pr_action.py capture \
            --request "reviewer/${REQUEST}" --build-target "$BUILD_TARGET" \
            --build-exit "$build_exit" --style-exit "$style_exit" \
            --output deterministic-evidence/runtime-deterministic-verification.json
      - name: Name deterministic artifact
        id: metadata
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          echo "artifact_name=advisory-deterministic-pr-${PULL_REQUEST}-${EXPECTED_HEAD}" >> "$GITHUB_OUTPUT"
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: deterministic-evidence/
          retention-days: 14

  publish-fast:
    name: Publish review-in-progress advisory output
    needs: fast-review
    if: ${{ needs.fast-review.result == 'success' && inputs.publish_comment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.fast-review.outputs.artifact_name }}
          path: review-artifact
      - name: Mint short-lived App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.FC_REVIEW_APP_ID }}
          private-key: ${{ secrets.FC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: read
          permission-pull-requests: write
      - name: Recheck head and select stable comments
        id: selection
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: reviewer/scripts
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          mkdir -p publication-evidence
          gh api "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > publication-evidence/live-pr.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py verify-head \
            --live-pr publication-evidence/live-pr.json --owner "$OWNER" --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" --expected-head "$EXPECTED_HEAD" \
            --output publication-evidence/comment-binding.json
          gh api --paginate --slurp "repos/${OWNER}/${REPOSITORY}/issues/${PULL_REQUEST}/comments" > publication-evidence/summary-comments.json
          gh api --paginate --slurp "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}/comments" > publication-evidence/inline-comments.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py select-summary \
            --comments publication-evidence/summary-comments.json --app-slug "$APP_SLUG" \
            --output publication-evidence/summary-selection.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py select-inline \
            --comments publication-evidence/inline-comments.json --app-slug "$APP_SLUG" \
            --request review-artifact/action-output/inline-review-create-request.json \
            --output publication-evidence/inline-selection.json
          echo "summary_action=$(jq -r .action publication-evidence/summary-selection.json)" >> "$GITHUB_OUTPUT"
          echo "summary_id=$(jq -r '.comment_id // ""' publication-evidence/summary-selection.json)" >> "$GITHUB_OUTPUT"
          echo "inline_action=$(jq -r .action publication-evidence/inline-selection.json)" >> "$GITHUB_OUTPUT"
          echo "inline_id=$(jq -r '.comment_id // ""' publication-evidence/inline-selection.json)" >> "$GITHUB_OUTPUT"
      - name: Create inline suggestion
        if: ${{ steps.selection.outputs.inline_action == 'create' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: gh api --method POST "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}/comments" --input review-artifact/action-output/inline-review-create-request.json
      - name: Update inline suggestion
        if: ${{ steps.selection.outputs.inline_action == 'update' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          COMMENT_ID: ${{ steps.selection.outputs.inline_id }}
        run: gh api --method PATCH "repos/${OWNER}/${REPOSITORY}/pulls/comments/${COMMENT_ID}" --input review-artifact/action-output/inline-review-update-request.json
      - name: Create review-in-progress summary
        if: ${{ steps.selection.outputs.summary_action == 'create' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: gh api --method POST "repos/${OWNER}/${REPOSITORY}/issues/${PULL_REQUEST}/comments" --input review-artifact/action-output/pr-comment-request.json
      - name: Update review-in-progress summary
        if: ${{ steps.selection.outputs.summary_action == 'update' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          COMMENT_ID: ${{ steps.selection.outputs.summary_id }}
        run: gh api --method PATCH "repos/${OWNER}/${REPOSITORY}/issues/comments/${COMMENT_ID}" --input review-artifact/action-output/pr-comment-request.json

  finalize:
    name: Finalize advisory report with deterministic evidence
    needs: [fast-review, deterministic]
    if: ${{ needs.fast-review.result == 'success' && needs.deterministic.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          path: review-target
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.fast-review.outputs.artifact_name }}
          path: fast-artifact
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.deterministic.outputs.artifact_name }}
          path: deterministic-artifact
      - name: Refuse head drift before finalization
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: reviewer/scripts
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          gh api "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > final-live-pr.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py verify-head \
            --live-pr final-live-pr.json --owner "$OWNER" --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" --expected-head "$EXPECTED_HEAD" --output final-binding.json
          test "$(git -C review-target rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Generate final structured output and summary
        id: metadata
        env:
          PYTHONPATH: reviewer/scripts
          REQUEST: ${{ inputs.request_path }}
          ACTIONABLE: ${{ inputs.actionable_review_path }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          artifact_name="advisory-external-pr-${PULL_REQUEST}-${EXPECTED_HEAD}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          python3 -B reviewer/scripts/run_external_pr_review.py \
            --request "reviewer/${REQUEST}" --observed-head "$EXPECTED_HEAD" --output-dir action-output \
            --runtime-deterministic deterministic-artifact/runtime-deterministic-verification.json
          cmp fast-artifact/action-output/audit-core.json action-output/audit-core.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py render \
            --core action-output/audit-core.json --actionable "reviewer/${ACTIONABLE}" --source-root review-target \
            --summary-output action-output/pr-comment-ready.md --summary-payload action-output/pr-comment-request.json \
            --inline-output action-output/inline-review-comment-ready.md \
            --inline-create-payload action-output/inline-review-create-request.json \
            --inline-update-payload action-output/inline-review-update-request.json \
            --metadata-output action-output/actionable-review-metadata.json \
            --expected-head "$EXPECTED_HEAD" --run-url "$RUN_URL" --artifact-name "$artifact_name" \
            --phase complete --runtime-deterministic deterministic-artifact/runtime-deterministic-verification.json
      - name: Publish neutral final check
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg head "$EXPECTED_HEAD" --arg url "$RUN_URL" '{name:"FC advisory review",head_sha:$head,status:"completed",conclusion:"neutral",details_url:$url,output:{title:"Advisory report finalized",summary:"Deterministic evidence is attached. This neutral advisory check is not acceptance, maintainer disposition, a merge decision, or mathematical truth."}}' > check.json
          gh api --method POST "repos/${OWNER}/${REPOSITORY}/check-runs" --input check.json
      - name: Upload final advisory artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            action-output/
            deterministic-artifact/
            final-binding.json
          retention-days: 14

  publish-final:
    name: Update advisory summary with verified Lean result
    needs: [finalize, publish-fast]
    if: ${{ always() && needs.finalize.result == 'success' && needs.publish-fast.result == 'success' && inputs.publish_comment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.finalize.outputs.artifact_name }}
          path: review-artifact
      - name: Mint short-lived App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.FC_REVIEW_APP_ID }}
          private-key: ${{ secrets.FC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: read
          permission-pull-requests: write
      - name: Recheck head and select the same summary
        id: selection
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: reviewer/scripts
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          gh api "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > live-pr.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py verify-head \
            --live-pr live-pr.json --owner "$OWNER" --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" --expected-head "$EXPECTED_HEAD" --output final-comment-binding.json
          gh api --paginate --slurp "repos/${OWNER}/${REPOSITORY}/issues/${PULL_REQUEST}/comments" > summary-comments.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py select-summary \
            --comments summary-comments.json --app-slug "$APP_SLUG" --output summary-selection.json
          echo "action=$(jq -r .action summary-selection.json)" >> "$GITHUB_OUTPUT"
          echo "comment_id=$(jq -r '.comment_id // ""' summary-selection.json)" >> "$GITHUB_OUTPUT"
      - name: Update finalized summary
        if: ${{ steps.selection.outputs.action == 'update' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          COMMENT_ID: ${{ steps.selection.outputs.comment_id }}
        run: gh api --method PATCH "repos/${OWNER}/${REPOSITORY}/issues/comments/${COMMENT_ID}" --input review-artifact/action-output/pr-comment-request.json
      - name: Refuse a missing review-in-progress summary
        if: ${{ steps.selection.outputs.action != 'update' }}
        run: |
          echo 'The finalizer will not create a second summary; the review-in-progress summary is missing.' >&2
          exit 1
      - name: State authority boundary
        if: always()
        run: echo 'Both summary phases and the inline suggestion are advisory only; no acceptance, apply, approval, label, or merge effect.' >> "$GITHUB_STEP_SUMMARY"
