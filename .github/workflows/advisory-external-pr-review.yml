name: Advisory external PR review
run-name: >-
  Advisory review of ${{ inputs.owner }}/${{ inputs.repository }}#${{ inputs.pull_request }}
  at ${{ inputs.expected_head }}

on:
  workflow_dispatch:
    inputs:
      owner:
        description: GitHub owner of the pull request's base repository
        required: true
        type: string
      repository:
        description: GitHub base repository name
        required: true
        type: string
      pull_request:
        description: Pull request number
        required: true
        type: string
      expected_head:
        description: Exact 40-character pull request head commit OID
        required: true
        type: string
      request_path:
        description: Retained review-request path on this trusted branch
        required: true
        default: audit/pr-audit-v1/fixtures/fork-dogfood-erdos-430-2/review-request.json
        type: string
      actionable_review_path:
        description: Exact-head actionable projection configuration on this trusted branch
        required: true
        default: audit/pr-audit-v1/fixtures/fork-dogfood-erdos-430-2/actionable-review.json
        type: string
      build_target:
        description: Exact Lean module target for lake --wfail build
        required: true
        default: FormalConjectures.ErdosProblems.«430»
        type: string
      publish_comment:
        description: Post or update the single App-authored advisory comment after a successful review
        required: true
        default: false
        type: boolean

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: advisory-external-pr-${{ inputs.owner }}-${{ inputs.repository }}-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  review:
    name: Bind, verify, and render advisory artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.review-metadata.outputs.artifact_name }}
    steps:
      - name: Check out trusted review implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false

      - name: Read current pull request state
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          mkdir -p action-evidence
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/pulls/${REVIEW_PULL_REQUEST}" \
            > action-evidence/live-pr.json

      - name: Check out the exact untrusted pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          fetch-depth: 0
          path: review-target
          persist-credentials: false

      - name: Refuse a changed head or mismatched request
        env:
          PYTHONPATH: reviewer/scripts
          REVIEW_REQUEST: ${{ inputs.request_path }}
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_REQUEST: ${{ inputs.pull_request }}
          REVIEW_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          checked_out_head=$(git -C review-target rev-parse HEAD)
          python3 -B reviewer/scripts/prepare_external_pr_action.py bind \
            --request "reviewer/${REVIEW_REQUEST}" \
            --live-pr action-evidence/live-pr.json \
            --owner "$REVIEW_OWNER" \
            --repository "$REVIEW_REPOSITORY" \
            --pull-request "$REVIEW_PULL_REQUEST" \
            --expected-head "$REVIEW_EXPECTED_HEAD" \
            --checked-out-head "$checked_out_head" \
            --output action-evidence/workflow-binding.json

      - name: Install elan
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run typed deterministic checks
        env:
          PYTHONPATH: reviewer/scripts
          REVIEW_REQUEST: ${{ inputs.request_path }}
          REVIEW_BUILD_TARGET: ${{ inputs.build_target }}
          REVIEW_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set +e
          (
            cd review-target
            lake exe cache get
            lake --wfail build "$REVIEW_BUILD_TARGET"
          ) > action-evidence/lean-build.log 2>&1
          build_exit=$?
          base_oid=$(python3 -c 'import json; print(json.load(open("action-evidence/live-pr.json"))["base"]["sha"])')
          git -C review-target diff --check "$base_oid...$REVIEW_EXPECTED_HEAD" \
            > action-evidence/diff-check.log 2>&1
          style_exit=$?
          set -e
          python3 -B reviewer/scripts/prepare_external_pr_action.py capture \
            --request "reviewer/${REVIEW_REQUEST}" \
            --build-target "$REVIEW_BUILD_TARGET" \
            --build-exit "$build_exit" \
            --style-exit "$style_exit" \
            --output action-evidence/runtime-deterministic-verification.json

      - name: Validate isolated evidence and render outputs
        env:
          PYTHONPATH: reviewer/scripts
          REVIEW_REQUEST: ${{ inputs.request_path }}
          REVIEW_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          python3 -B reviewer/scripts/run_external_pr_review.py \
            --request "reviewer/${REVIEW_REQUEST}" \
            --observed-head "$REVIEW_EXPECTED_HEAD" \
            --output-dir action-output \
            --runtime-deterministic action-evidence/runtime-deterministic-verification.json

      - name: Render the stable advisory comment projection
        id: review-metadata
        env:
          PYTHONPATH: reviewer/scripts
          REVIEW_EXPECTED_HEAD: ${{ inputs.expected_head }}
          REVIEW_PULL_REQUEST: ${{ inputs.pull_request }}
          REVIEW_ACTIONABLE: ${{ inputs.actionable_review_path }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          artifact_name="advisory-external-pr-${REVIEW_PULL_REQUEST}-${REVIEW_EXPECTED_HEAD}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          python3 -B reviewer/scripts/prepare_external_pr_comment.py render \
            --core action-output/audit-core.json \
            --actionable "reviewer/${REVIEW_ACTIONABLE}" \
            --source-root review-target \
            --summary-output action-output/pr-comment-ready.md \
            --summary-payload action-output/pr-comment-request.json \
            --inline-output action-output/inline-review-comment-ready.md \
            --inline-create-payload action-output/inline-review-create-request.json \
            --inline-update-payload action-output/inline-review-update-request.json \
            --metadata-output action-output/actionable-review-metadata.json \
            --expected-head "$REVIEW_EXPECTED_HEAD" \
            --run-url "$REVIEW_RUN_URL" \
            --artifact-name "$artifact_name"

      - name: Publish a neutral PR-visible advisory check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_EXPECTED_HEAD: ${{ inputs.expected_head }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY' > action-evidence/check-run-request.json
          import json
          import os

          status = os.environ["REVIEW_JOB_STATUS"]
          title = "Advisory artifacts ready" if status == "success" else "Advisory workflow needs inspection"
          summary = (
              f"FC advisory review artifacts finished with workflow status {status}. "
              "This neutral check is not maintainer disposition, acceptance, a merge decision, "
              "or a claim of mathematical truth. Comment publication, when explicitly requested, "
              "uses a separate GitHub App job."
          )
          print(json.dumps({
              "name": "FC advisory review",
              "head_sha": os.environ["REVIEW_EXPECTED_HEAD"],
              "status": "completed",
              "conclusion": "neutral",
              "details_url": os.environ["REVIEW_RUN_URL"],
              "external_id": os.environ.get("GITHUB_RUN_ID", ""),
              "output": {"title": title, "summary": summary},
          }))
          PY
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/check-runs" \
            --input action-evidence/check-run-request.json \
            > action-evidence/check-run-response.json

      - name: Upload advisory evidence and drafts
        id: review-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advisory-external-pr-${{ inputs.pull_request }}-${{ inputs.expected_head }}
          path: |
            action-evidence/
            action-output/
          if-no-files-found: warn
          retention-days: 14

      - name: State the authority boundary
        if: always()
        env:
          REVIEW_PUBLISH_COMMENT: ${{ inputs.publish_comment }}
        run: |
          echo 'The structured report and Markdown projections are advisory only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'They do not approve, merge, or establish maintainer disposition or mathematical truth.' >> "$GITHUB_STEP_SUMMARY"
          echo "App comment publication requested: ${REVIEW_PUBLISH_COMMENT}." >> "$GITHUB_STEP_SUMMARY"

  publish-comment:
    name: Publish one App-authored advisory comment
    needs: review
    if: ${{ needs.review.result == 'success' && inputs.publish_comment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted publication implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false

      - name: Download the completed advisory artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.review.outputs.artifact_name }}
          path: review-artifact

      - name: Mint a short-lived FC Review Pilot installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.FC_REVIEW_APP_ID }}
          private-key: ${{ secrets.FC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: read
          permission-pull-requests: write

      - name: Recheck the exact head and select stable App comments
        id: comment-selection
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: reviewer/scripts
          REVIEW_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_REQUEST: ${{ inputs.pull_request }}
          REVIEW_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          mkdir -p publication-evidence
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/pulls/${REVIEW_PULL_REQUEST}" \
            > publication-evidence/live-pr.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py verify-head \
            --live-pr publication-evidence/live-pr.json \
            --owner "$REVIEW_OWNER" \
            --repository "$REVIEW_REPOSITORY" \
            --pull-request "$REVIEW_PULL_REQUEST" \
            --expected-head "$REVIEW_EXPECTED_HEAD" \
            --output publication-evidence/comment-binding.json
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/issues/${REVIEW_PULL_REQUEST}/comments" \
            > publication-evidence/summary-comments.json
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/pulls/${REVIEW_PULL_REQUEST}/comments" \
            > publication-evidence/inline-comments.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py select-summary \
            --comments publication-evidence/summary-comments.json \
            --app-slug "$REVIEW_APP_SLUG" \
            --output publication-evidence/summary-selection.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py select-inline \
            --comments publication-evidence/inline-comments.json \
            --request review-artifact/action-output/inline-review-create-request.json \
            --app-slug "$REVIEW_APP_SLUG" \
            --output publication-evidence/inline-selection.json
          echo "summary_action=$(python3 -c 'import json; print(json.load(open("publication-evidence/summary-selection.json"))["action"])')" >> "$GITHUB_OUTPUT"
          echo "summary_id=$(python3 -c 'import json; print(json.load(open("publication-evidence/summary-selection.json"))["comment_id"] or "")')" >> "$GITHUB_OUTPUT"
          echo "inline_action=$(python3 -c 'import json; print(json.load(open("publication-evidence/inline-selection.json"))["action"])')" >> "$GITHUB_OUTPUT"
          echo "inline_id=$(python3 -c 'import json; print(json.load(open("publication-evidence/inline-selection.json"))["comment_id"] or "")')" >> "$GITHUB_OUTPUT"

      - name: Create the inline advisory suggestion
        if: ${{ steps.comment-selection.outputs.inline_action == 'create' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/pulls/${REVIEW_PULL_REQUEST}/comments" \
            --input review-artifact/action-output/inline-review-create-request.json \
            > publication-evidence/inline-comment-response.json

      - name: Update the inline advisory suggestion
        if: ${{ steps.comment-selection.outputs.inline_action == 'update' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_INLINE_ID: ${{ steps.comment-selection.outputs.inline_id }}
        run: |
          gh api --method PATCH -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/pulls/comments/${REVIEW_INLINE_ID}" \
            --input review-artifact/action-output/inline-review-update-request.json \
            > publication-evidence/inline-comment-response.json

      - name: Create the advisory summary
        if: ${{ steps.comment-selection.outputs.summary_action == 'create' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/issues/${REVIEW_PULL_REQUEST}/comments" \
            --input review-artifact/action-output/pr-comment-request.json \
            > publication-evidence/comment-response.json

      - name: Update the advisory summary
        if: ${{ steps.comment-selection.outputs.summary_action == 'update' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_COMMENT_ID: ${{ steps.comment-selection.outputs.summary_id }}
        run: |
          gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REVIEW_OWNER}/${REVIEW_REPOSITORY}/issues/comments/${REVIEW_COMMENT_ID}" \
            --input review-artifact/action-output/pr-comment-request.json \
            > publication-evidence/comment-response.json

      - name: State the publication boundary
        if: always()
        env:
          REVIEW_COMMENT_ACTION: ${{ steps.comment-selection.outputs.summary_action }}
          REVIEW_INLINE_ACTION: ${{ steps.comment-selection.outputs.inline_action }}
        run: |
          echo "FC Review Pilot comment action: ${REVIEW_COMMENT_ACTION:-not-run}." >> "$GITHUB_STEP_SUMMARY"
          echo "FC Review Pilot inline action: ${REVIEW_INLINE_ACTION:-not-run}." >> "$GITHUB_STEP_SUMMARY"
          echo 'The comment is an advisory projection only. It has no acceptance or maintainer-authority effect.' >> "$GITHUB_STEP_SUMMARY"
