name: Build Lean project and deploy docs

on:
  push:
    branches:
      - main
      - '*-webtest'
  pull_request:
  workflow_dispatch:
    inputs:
      website_only:
        description: 'Skip Lean build and use live site data (for website development)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The category check is a policy gate, so it has tests of its own. They need
  # no Lean build, so they run alongside it rather than after it.
  scripts:
    runs-on: ubuntu-latest
    name: Test scripts
    steps:
      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.9'

      - name: Run script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    runs-on: ubuntu-latest
    name: Build project
    # `actions: read` is for downloading the category diagnostics recorded by
    # the last `main` run, so a pull request can be compared against its base.
    permissions:
      contents: read
      actions: read
    steps:

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Detect whether this is a website-only build (skip slow Lean compilation).
      # Triggers:
      #   - Branches ending in -webtest
      #   - Manual workflow_dispatch with website_only=true
      - name: Detect build mode
        id: mode
        env:
          WEBSITE_ONLY: ${{ inputs.website_only }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$WEBSITE_ONLY" == "true" ]] || \
             [[ "$REF_NAME" == *-webtest ]]; then
            echo "website_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Website-only build: skipping Lean compilation, downloading data from live site."
          else
            echo "website_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elan
        if: steps.mode.outputs.website_only != 'true'
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Restore ~/.cache/mathlib
        if: steps.mode.outputs.website_only != 'true'
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cache/mathlib
          key: oleans-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            oleans-${{ hashFiles('lake-manifest.json') }}-
            oleans-

      - name: Get olean cache
        if: steps.mode.outputs.website_only != 'true'
        run: |
          lake exe cache unpack
          lake exe cache get

      - name: Generate All.lean
        if: steps.mode.outputs.website_only != 'true'
        run: |
          rm -f FormalConjectures/All.lean
          lake exe mk_all --lib FormalConjectures || true
          mv FormalConjectures.lean FormalConjectures/All.lean
          echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean

      - name: Build project
        if: steps.mode.outputs.website_only != 'true'
        run: |
          lake --wfail build
          rm -f FormalConjectures/All.lean

      - name: Build literate source pages
        if: steps.mode.outputs.website_only != 'true'
        run: |
          cd docbuild
          export MATHLIB_NO_CACHE_ON_UPDATE=1
          lake update formal_conjectures
          # Some modules crash verso-literate (e.g. metaprogramming-heavy util files),
          # so we make this best-effort: render whatever succeeds.
          # TODO(firsching): examine exactly what fails and fix or report as bug to verso
          lake build FormalConjectures:literate || true
          # Remove empty/corrupt JSON files left by failed builds
          find .lake/build/literate -name "*.json" -empty -delete 2>/dev/null || true
          lake exe verso-html .lake/build/literate ../_literate_html || true

      - name: Post-process literate HTML
        if: steps.mode.outputs.website_only != 'true'
        run: |
          python3 site/fix_literate_html.py _literate_html

      - name: Pack olean cache
        if: steps.mode.outputs.website_only != 'true'
        run: |
          lake exe cache pack
          ls ~/.cache/mathlib

      - name: Save ~/.cache/mathlib
        if: steps.mode.outputs.website_only != 'true'
        uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cache
          key: oleans-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}

      - name: Set up Python
        if: steps.mode.outputs.website_only != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.9'

      - name: Install Python dependencies
        if: steps.mode.outputs.website_only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 numpy==2.2.3 plotly==5.20.0 beautifulsoup4 lxml

      - name: Run plotting script
        if: steps.mode.outputs.website_only != 'true'
        run: |
          mkdir -p site/data
          python site/plot_growth.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'

      - name: Generate conjectures data for website
        if: steps.mode.outputs.website_only != 'true'
        run: |
          mkdir -p site/data
          lake exe extract_names --exclude=statement,docstring,moduleDocstrings \
            > site/data/conjectures.json

      # The category diagnostics below are only worth reporting as a delta, so
      # each `main` run records them as an artifact and a pull request compares
      # against the one for its base commit. Nothing here is executed: the
      # artifact is JSON, read by a script that validates it and refuses a
      # snapshot taken at any other commit. A missing artifact (base predates
      # this, its run failed, it expired, or the two runs raced) is not an
      # error; the comparison is skipped and totals are reported instead.
      - name: Fetch category diagnostics for the base commit
        if: steps.mode.outputs.website_only != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Artifacts come back newest first, so the first match is the most
          # recent `main` run for the base commit. Fork runs upload nothing,
          # but check the repository anyway rather than trust the name alone.
          matches=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=category-diagnostics&per_page=100" \
            --jq "[.artifacts[]
                   | select(.expired == false
                            and .workflow_run.head_sha == \"$BASE_SHA\"
                            and .workflow_run.head_branch == \"main\"
                            and .workflow_run.head_repository_id
                                == .workflow_run.repository_id)
                   | .id] | .[]" || true)
          id=${matches%%$'\n'*}
          if [[ -z "$id" ]]; then
            echo "::notice::No category diagnostics recorded for base ${BASE_SHA:0:7}."
            exit 0
          fi
          # Nothing below is worth failing a pull request over: without the
          # baseline the check still runs, it just reports totals.
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > base.zip; then
            echo "::warning::Could not download the base category diagnostics."
            exit 0
          fi
          if ! unzip -o -j base.zip category-diagnostics.json -d base; then
            echo "::warning::Base artifact held no category-diagnostics.json."
          fi

      # `extract_names` notices `research open` problems with a sorry-free proof, and
      # `test`/`API` statements without one, both decidable from the JSON above. The
      # first is a contradiction and fails whether or not it is new; the other two go
      # to the run summary, with the ones this change introduces called out.
      - name: Check category warnings
        if: steps.mode.outputs.website_only != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=(site/data/conjectures.json
                --snapshot category-diagnostics.json
                --source-sha "$GITHUB_SHA")
          # There is a base to compare against only on a pull request.
          if [[ -n "${BASE_SHA:-}" ]]; then
            args+=(--base-snapshot base/category-diagnostics.json
                   --base-sha "$BASE_SHA")
          fi
          python3 scripts/check_category_warnings.py "${args[@]}"

      - name: Record category diagnostics for this commit
        if: >-
          steps.mode.outputs.website_only != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: category-diagnostics
          path: category-diagnostics.json
          if-no-files-found: error

      - name: Extract Verso fragments for website
        if: steps.mode.outputs.website_only != 'true'
        run: |
          python3 site/extract_verso_fragments.py _literate_html site/data/verso-fragments.json

      # In website-only mode, download data from the live production site
      # instead of building it from scratch. The live site serves the processed
      # format ({ conjectures, versoFragments, ... }), so we convert it back to
      # the raw extract_names format ({ problems }) that build.js expects.
      - name: Download live site data
        if: steps.mode.outputs.website_only == 'true'
        run: |
          LIVE_URL="https://google-deepmind.github.io/formal-conjectures"
          mkdir -p site/data _literate_html
          echo "Downloading conjectures data from $LIVE_URL ..."
          curl -sfL "$LIVE_URL/data/conjectures.json" -o /tmp/live_conjectures.json
          echo "Downloading growth plots from $LIVE_URL ..."
          curl -sfL "$LIVE_URL/data/file_counts_white.html" -o site/data/file_counts_white.html || true
          curl -sfL "$LIVE_URL/data/file_counts_dark.html" -o site/data/file_counts_dark.html || true
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/live_conjectures.json', 'utf8'));

            // Convert processed conjectures back to raw extract_names format
            const problems = (data.conjectures || []).map(c => ({
              theorem: c.theorem,
              module: c.module,
              category: c.category,
              subjects: (c.subjects || []).map(s =>
                typeof s === 'object' ? s.code : s
              ),
              formalProofKind: c.formalProofKind || null,
              formalProofLink: c.formalProofLink || null,
              hasSorryFreeProof: false,
            }));
            fs.writeFileSync(
              'site/data/conjectures.json',
              JSON.stringify({ problems })
            );

            // Extract Verso fragments if present
            if (data.versoFragments) {
              fs.writeFileSync(
                'site/data/verso-fragments.json',
                JSON.stringify(data.versoFragments)
              );
            }
            console.log('Converted ' + problems.length + ' conjectures to raw format.');
          "

      - name: Build website
        run: |
          cd site
          node build.js
        env:
          BASE_PATH: /formal-conjectures
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assemble deploy artifact
        run: |
          mkdir -p _deploy
          # Website goes at root
          cp -r site/site/* _deploy/
          # Literate source pages go under /src (may not exist in website-only mode)
          if [[ -d _literate_html ]] && [[ -n "$(ls -A _literate_html 2>/dev/null)" ]]; then
            cp -r _literate_html _deploy/src
          fi

      - name: Upload deploy artifact
        id: deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _deploy

  # Deployment job
  deploy:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.repository != 'google-deepmind/formal-conjectures' &&
       endsWith(github.ref_name, '-webtest'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only the deployment job needs write access to Pages and the OIDC token.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
