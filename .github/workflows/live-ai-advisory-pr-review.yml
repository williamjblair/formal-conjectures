name: FC Review Pilot — live AI advisory
run-name: Live AI review of ${{ inputs.owner }}/${{ inputs.repository }}#${{ inputs.pull_request }} at ${{ inputs.expected_head }}

on:
  workflow_dispatch:
    inputs:
      owner:
        description: GitHub owner of the PR base repository
        required: true
        type: string
      repository:
        description: GitHub PR base repository name
        required: true
        type: string
      pull_request:
        description: Pull request number
        required: true
        type: string
      expected_head:
        description: Exact 40-character PR head OID
        required: true
        type: string
      live_ai_config_path:
        description: Trusted exact-head, conclusion-free AI input configuration
        required: true
        default: audit/pr-audit-v1/fixtures/fork-dogfood-erdos-430-2/live-ai-review-config.json
        type: string
      build_target:
        description: Exact Lean module target
        required: true
        default: FormalConjectures.ErdosProblems.«430»
        type: string
      expected_import:
        description: Exact import policy for the reviewed module
        required: true
        default: FormalConjecturesUtil
        type: string
      run_ai_review:
        description: Invoke one fresh primary Claude review; false is a credential-free deterministic pilot
        required: true
        default: true
        type: boolean
      escalation_mode:
        description: Auto-escalate ambiguity/invalid output, force a manual escalation, or disable escalation
        required: true
        default: auto
        type: choice
        options: [auto, force, "off"]
      publish_comment:
        description: Upsert the App summary and independently validated inline findings
        required: true
        default: true
        type: boolean
      model:
        description: Exact Claude API model identifier retained in the execution receipt
        required: true
        default: claude-sonnet-5
        type: choice
        options: [claude-sonnet-5, claude-opus-4-8, claude-haiku-4-5-20251001]
      effort:
        description: Claude reasoning effort retained in the execution receipt
        required: true
        default: high
        type: choice
        options: [low, medium, high, xhigh]
      max_budget_usd_per_role:
        description: Hard Claude API budget cap for the primary or optional escalation review
        required: true
        default: "5.00"
        type: choice
        options: ["1.00", "2.50", "5.00", "10.00"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fc-live-ai-review-${{ inputs.owner }}-${{ inputs.repository }}-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Bind and sanitize exact-head inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - id: phase-start
        name: Record prepare start
        run: echo "epoch_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false
      - name: Read live PR state
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          mkdir -p binding
          gh api "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > binding/live-pr.json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          fetch-depth: 0
          path: review-target
          persist-credentials: false
      - name: Create conclusion-free sanitized model input
        env:
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
          CONFIG: ${{ inputs.live_ai_config_path }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RUN_AI_REVIEW: ${{ inputs.run_ai_review }}
          PUBLISH_COMMENT: ${{ inputs.publish_comment }}
        run: |
          args=()
          [[ "$RUN_AI_REVIEW" == true ]] && args+=(--run-ai-review)
          [[ "$PUBLISH_COMMENT" == true ]] && args+=(--publish-comment)
          python3 -B -m fc_review_bot prepare \
            --config "reviewer/${CONFIG}" --live-pr binding/live-pr.json --source-root review-target \
            --expected-head "$EXPECTED_HEAD" \
            --skill-path reviewer/.agents/skills/formal-conjectures-review/SKILL.md --agents-path reviewer/AGENTS.md \
            --output-schema reviewer/.agents/schemas/live-ai-review-role-output.schema.json \
            --output-dir live-ai-input "${args[@]}"
          test "$(git -C review-target rev-parse HEAD)" = "$EXPECTED_HEAD"
      - id: metadata
        name: Name sanitized input artifact
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: echo "artifact_name=fc-live-ai-input-${PULL_REQUEST}-${EXPECTED_HEAD}" >> "$GITHUB_OUTPUT"
      - name: Retain prepare duration
        env:
          STARTED_AT_EPOCH_MS: ${{ steps.phase-start.outputs.epoch_ms }}
        run: |
          PYTHONPATH=reviewer/.agents/fc-review-bot/src python3 -B -m fc_review_bot record-phase \
            --phase prepare --started-at-epoch-ms "$STARTED_AT_EPOCH_MS" \
            --finished-at-epoch-ms "$(date +%s%3N)" --output live-ai-input/phase-prepare.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: live-ai-input/
          retention-days: 14

  deterministic:
    name: Deterministic Lean, diff, style, and import gates
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - id: phase-start
        name: Record deterministic start
        run: echo "epoch_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: reviewer
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          fetch-depth: 0
          path: review-target
          persist-credentials: false
      - name: Recheck exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
          CONFIG: ${{ inputs.live_ai_config_path }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          mkdir -p deterministic-evidence
          gh api "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > deterministic-evidence/live-pr.json
          python3 -B -m fc_review_bot prepare \
            --config "reviewer/${CONFIG}" --live-pr deterministic-evidence/live-pr.json --source-root review-target \
            --expected-head "$EXPECTED_HEAD" --skill-path reviewer/.agents/skills/formal-conjectures-review/SKILL.md --agents-path reviewer/AGENTS.md \
            --output-schema reviewer/.agents/schemas/live-ai-review-role-output.schema.json \
            --output-dir deterministic-evidence/binding
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run bounded checks and retain typed outcome
        env:
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
          CONFIG: ${{ inputs.live_ai_config_path }}
          BUILD_TARGET: ${{ inputs.build_target }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set +e
          (cd review-target && lake exe cache get) > deterministic-evidence/cache.log 2>&1
          timeout 35m bash -c 'cd review-target && lake --wfail build "$BUILD_TARGET"' > deterministic-evidence/style-lint.log 2>&1
          style_exit=$?
          timeout 5m bash -c 'cd review-target && lake build "$BUILD_TARGET"' > deterministic-evidence/lean-build.log 2>&1
          lean_exit=$?
          base_oid=$(python3 -c 'import json; print(json.load(open("deterministic-evidence/live-pr.json"))["base"]["sha"])')
          git -C review-target diff --check "$base_oid...$EXPECTED_HEAD" > deterministic-evidence/diff-check.log 2>&1
          diff_exit=$?
          python3 -B -m fc_review_bot check-imports \
            --config "reviewer/${CONFIG}" --source-root review-target \
            --expected-import "${{ inputs.expected_import }}" \
            --output deterministic-evidence/import-policy.json > deterministic-evidence/import-policy.log 2>&1
          import_exit=$?
          set -e
          python3 -B -m fc_review_bot capture-deterministic \
            --config "reviewer/${CONFIG}" --build-target "$BUILD_TARGET" \
            --lean-exit "$lean_exit" --diff-exit "$diff_exit" \
            --style-exit "$style_exit" --import-exit "$import_exit" \
            --output deterministic-evidence/runtime-deterministic.json
      - id: metadata
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: echo "artifact_name=fc-live-ai-deterministic-${PULL_REQUEST}-${EXPECTED_HEAD}" >> "$GITHUB_OUTPUT"
      - name: Retain deterministic duration
        env:
          STARTED_AT_EPOCH_MS: ${{ steps.phase-start.outputs.epoch_ms }}
        run: |
          PYTHONPATH=reviewer/.agents/fc-review-bot/src python3 -B -m fc_review_bot record-phase \
            --phase deterministic --started-at-epoch-ms "$STARTED_AT_EPOCH_MS" \
            --finished-at-epoch-ms "$(date +%s%3N)" --output deterministic-evidence/phase-deterministic.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: deterministic-evidence/
          retention-days: 14

  ai-preflight:
    name: Confirm protected Anthropic credential
    needs: prepare
    if: ${{ inputs.run_ai_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Refuse missing protected API key before invoking Claude
        env:
          FC_REVIEW_ANTHROPIC_API_KEY: ${{ secrets.FC_REVIEW_ANTHROPIC_API_KEY }}
        run: test -n "$FC_REVIEW_ANTHROPIC_API_KEY"

  ai-primary:
    name: Primary Claude review using the FC skill
    needs: [prepare, ai-preflight]
    if: ${{ inputs.run_ai_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      session_id: ${{ steps.claude.outputs.session_id }}
      usage: ${{ steps.usage.outputs.receipt }}
    steps:
      - id: phase-start
        name: Record primary review start
        run: echo "epoch_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.prepare.outputs.artifact_name }}", path: .fc-review-input}
      - id: contract
        name: Load the bound FC skill contract
        run: |
          echo 'prompt<<__FC_REVIEW_PROMPT__' >> "$GITHUB_OUTPUT"
          cat .fc-review-input/prompt-primary_review.md >> "$GITHUB_OUTPUT"
          echo '__FC_REVIEW_PROMPT__' >> "$GITHUB_OUTPUT"
          echo "schema=$(jq -c '.' .fc-review-input/role-output.schema.json)" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1, dereferenced 2026-08-18
        with:
          anthropic_api_key: ${{ secrets.FC_REVIEW_ANTHROPIC_API_KEY }}
          prompt: ${{ steps.contract.outputs.prompt }}
          display_report: "false"
          show_full_output: "false"
          track_progress: "false"
          use_sticky_comment: "false"
          include_fix_links: "false"
          claude_args: >-
            --model "${{ inputs.model }}" --effort "${{ inputs.effort }}"
            --json-schema '${{ steps.contract.outputs.schema }}'
            --permission-mode plan --safe-mode
            --no-session-persistence --max-turns 40
            --max-budget-usd "${{ inputs.max_budget_usd_per_role }}"
      - name: Load trusted usage sanitizer after model execution
        if: ${{ always() }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - id: usage
        name: Retain bounded provider usage without raw model content
        if: ${{ always() }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          STARTED_AT_EPOCH_MS: ${{ steps.phase-start.outputs.epoch_ms }}
        run: |
          PYTHONPATH=reviewer/.agents/fc-review-bot/src python3 -B -m fc_review_bot capture-provider-usage \
            --role primary_review --execution-file "$EXECUTION_FILE" --model "${{ inputs.model }}" \
            --max-budget-usd-per-role "${{ inputs.max_budget_usd_per_role }}" \
            --started-at-epoch-ms "$STARTED_AT_EPOCH_MS" --finished-at-epoch-ms "$(date +%s%3N)" \
            --output provider-usage.json
          echo "receipt=$(jq -c . provider-usage.json)" >> "$GITHUB_OUTPUT"

  inspect-primary:
    name: Validate primary receipt and decide escalation
    needs: [prepare, ai-primary]
    if: ${{ inputs.run_ai_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.inspect.outputs.status }}
      escalation_required: ${{ steps.inspect.outputs.escalation_required }}
      reason: ${{ steps.inspect.outputs.reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.prepare.outputs.artifact_name }}", path: live-ai-input}
      - id: inspect
        name: Inspect actual primary output; retain typed validation error
        env:
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
          FC_AI_PRIMARY_REVIEW_OUTPUT: ${{ needs.ai-primary.outputs.result }}
          FC_AI_PRIMARY_REVIEW_SESSION_ID: ${{ needs.ai-primary.outputs.session_id }}
        run: |
          python3 -B -m fc_review_bot inspect-primary \
            --input-manifest live-ai-input/input-manifest.json --output primary-inspection.json
          echo "status=$(jq -r .status primary-inspection.json)" >> "$GITHUB_OUTPUT"
          echo "escalation_required=$(jq -r .escalation_required primary-inspection.json)" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r .reason primary-inspection.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fc-live-ai-primary-inspection-${{ inputs.pull_request }}-${{ inputs.expected_head }}
          path: primary-inspection.json
          retention-days: 14

  ai-escalation:
    name: Optional FC skill escalation
    needs: [prepare, ai-preflight, inspect-primary]
    if: >-
      ${{ inputs.run_ai_review &&
          (inputs.escalation_mode == 'force' ||
           (inputs.escalation_mode == 'auto' && needs.inspect-primary.outputs.escalation_required == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, id-token: write}
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      session_id: ${{ steps.claude.outputs.session_id }}
      usage: ${{ steps.usage.outputs.receipt }}
    steps:
      - id: phase-start
        name: Record escalation review start
        run: echo "epoch_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.prepare.outputs.artifact_name }}", path: .fc-review-input}
      - id: contract
        name: Load the bound FC skill contract
        run: |
          echo 'prompt<<__FC_REVIEW_PROMPT__' >> "$GITHUB_OUTPUT"
          cat .fc-review-input/prompt-escalation_review.md >> "$GITHUB_OUTPUT"
          echo '__FC_REVIEW_PROMPT__' >> "$GITHUB_OUTPUT"
          echo "schema=$(jq -c '.' .fc-review-input/role-output.schema.json)" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1, dereferenced 2026-08-18
        with:
          anthropic_api_key: ${{ secrets.FC_REVIEW_ANTHROPIC_API_KEY }}
          prompt: ${{ steps.contract.outputs.prompt }}
          display_report: "false"
          show_full_output: "false"
          track_progress: "false"
          use_sticky_comment: "false"
          include_fix_links: "false"
          claude_args: >-
            --model "${{ inputs.model }}" --effort "${{ inputs.effort }}"
            --json-schema '${{ steps.contract.outputs.schema }}'
            --permission-mode plan --safe-mode
            --no-session-persistence --max-turns 40
            --max-budget-usd "${{ inputs.max_budget_usd_per_role }}"
      - name: Load trusted usage sanitizer after model execution
        if: ${{ always() }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - id: usage
        name: Retain bounded provider usage without raw model content
        if: ${{ always() }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          STARTED_AT_EPOCH_MS: ${{ steps.phase-start.outputs.epoch_ms }}
        run: |
          PYTHONPATH=reviewer/.agents/fc-review-bot/src python3 -B -m fc_review_bot capture-provider-usage \
            --role escalation_review --execution-file "$EXECUTION_FILE" --model "${{ inputs.model }}" \
            --max-budget-usd-per-role "${{ inputs.max_budget_usd_per_role }}" \
            --started-at-epoch-ms "$STARTED_AT_EPOCH_MS" --finished-at-epoch-ms "$(date +%s%3N)" \
            --output provider-usage.json
          echo "receipt=$(jq -c . provider-usage.json)" >> "$GITHUB_OUTPUT"

  validate-ai:
    name: Validate primary and optional escalation receipts
    needs: [prepare, ai-primary, inspect-primary, ai-escalation]
    if: >-
      ${{ always() && inputs.run_ai_review && needs.prepare.result == 'success' &&
          needs.ai-primary.result == 'success' && needs.inspect-primary.result == 'success' &&
          (needs.ai-escalation.result == 'success' || needs.ai-escalation.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.prepare.outputs.artifact_name }}", path: live-ai-input}
      - name: Validate exact structured outputs; no stored fallback
        env:
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
          FC_AI_PRIMARY_REVIEW_OUTPUT: ${{ needs.ai-primary.outputs.result }}
          FC_AI_PRIMARY_REVIEW_SESSION_ID: ${{ needs.ai-primary.outputs.session_id }}
          FC_AI_PRIMARY_REVIEW_USAGE: ${{ needs.ai-primary.outputs.usage }}
          FC_AI_ESCALATION_REVIEW_OUTPUT: ${{ needs.ai-escalation.outputs.result }}
          FC_AI_ESCALATION_REVIEW_SESSION_ID: ${{ needs.ai-escalation.outputs.session_id }}
          FC_AI_ESCALATION_REVIEW_USAGE: ${{ needs.ai-escalation.outputs.usage }}
          PRIMARY_STATUS: ${{ needs.inspect-primary.outputs.status }}
          PRIMARY_REASON: ${{ needs.inspect-primary.outputs.reason }}
          ESCALATION_MODE: ${{ inputs.escalation_mode }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        run: |
          escalation_trigger=none
          configured_role_limit=2
          [[ "$ESCALATION_MODE" == off ]] && configured_role_limit=1
          if [[ "$ESCALATION_MODE" == force ]]; then
            escalation_trigger=manual
          elif [[ "$PRIMARY_STATUS" == error ]]; then
            escalation_trigger=validation_error
          elif [[ "$PRIMARY_REASON" == primary_inconclusive ]]; then
            escalation_trigger=ambiguity
          fi
          python3 -B -m fc_review_bot validate-panel \
            --input-manifest live-ai-input/input-manifest.json --output-dir ai-evidence \
            --action-commit d40ddef4c030e508327d6e35a9c45f3368482c50 \
            --model "$MODEL" --effort "$EFFORT" \
            --escalation-trigger "$escalation_trigger" \
            --configured-role-limit "$configured_role_limit" \
            --max-budget-usd-per-role "${{ inputs.max_budget_usd_per_role }}" \
            --github-run-id "${{ github.run_id }}" --github-run-attempt "${{ github.run_attempt }}"
      - id: metadata
        env: {PULL_REQUEST: "${{ inputs.pull_request }}", EXPECTED_HEAD: "${{ inputs.expected_head }}"}
        run: echo "artifact_name=fc-live-ai-panel-${PULL_REQUEST}-${EXPECTED_HEAD}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "${{ steps.metadata.outputs.artifact_name }}", path: ai-evidence/, retention-days: 14}

  render-progress:
    name: Render stable review-in-progress summary
    needs: [validate-ai]
    if: ${{ always() && needs.validate-ai.result == 'success' }}
    runs-on: ubuntu-latest
    outputs: {artifact_name: "${{ steps.metadata.outputs.artifact_name }}"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.validate-ai.outputs.artifact_name }}", path: ai-evidence}
      - id: metadata
        env: {PULL_REQUEST: "${{ inputs.pull_request }}", EXPECTED_HEAD: "${{ inputs.expected_head }}"}
        run: |
          echo "artifact_name=fc-live-ai-progress-${PULL_REQUEST}-${EXPECTED_HEAD}" >> "$GITHUB_OUTPUT"
          mkdir -p progress
          PYTHONPATH=reviewer/.agents/fc-review-bot/src python3 -B -m fc_review_bot render \
            --panel ai-evidence/ai-review-panel.json --phase in-progress --expected-head "$EXPECTED_HEAD" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact-name "fc-live-ai-final-${PULL_REQUEST}-${EXPECTED_HEAD}" \
            --summary progress/summary.md --summary-payload progress/summary.json \
            --inline-dir progress/inline --metadata progress/metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "${{ steps.metadata.outputs.artifact_name }}", path: progress/, retention-days: 14}

  validate-suggestions:
    name: Deterministically validate localized suggestions
    needs: [validate-ai, deterministic]
    if: ${{ always() && needs.validate-ai.result == 'success' && needs.deterministic.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs: {artifact_name: "${{ steps.metadata.outputs.artifact_name }}"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.owner }}/${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_request }}/head
          fetch-depth: 0
          path: review-target
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.validate-ai.outputs.artifact_name }}", path: ai-evidence}
      - name: Prepare exact-head suggestion candidate
        id: prepare
        env: {PYTHONPATH: reviewer/.agents/fc-review-bot/src, EXPECTED_HEAD: "${{ inputs.expected_head }}"}
        run: |
          test "$(git -C review-target rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B -m fc_review_bot validate-suggestion \
            --panel ai-evidence/ai-review-panel.json --source-root review-target --output prepared.json
          echo "outcome=$(jq -r .outcome prepared.json)" >> "$GITHUB_OUTPUT"
      - name: Install elan for suggestion validation
        if: ${{ steps.prepare.outputs.outcome == 'prepared' }}
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build each localized suggestion independently
        env:
          BUILD_TARGET: "${{ inputs.build_target }}"
          EXPECTED_HEAD: "${{ inputs.expected_head }}"
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
        run: |
          mkdir -p suggestion-results suggestion-logs
          if [[ "${{ steps.prepare.outputs.outcome }}" == prepared ]]; then
            (cd review-target && lake exe cache get)
          fi
          while IFS= read -r key; do
            git -C review-target restore --source="$EXPECTED_HEAD" --worktree --staged -- .
            python3 -B -m fc_review_bot apply-suggestion \
              --prepared prepared.json --key "$key" --source-root review-target
            set +e
            timeout 8m bash -c 'cd review-target && lake --wfail build "$BUILD_TARGET"' > "suggestion-logs/${key}-build.log" 2>&1
            build_exit=$?
            git -C review-target diff --check > "suggestion-logs/${key}-diff-check.log" 2>&1
            diff_exit=$?
            set -e
            python3 -B -m fc_review_bot record-suggestion \
              --prepared prepared.json --key "$key" --build-exit "$build_exit" --diff-exit "$diff_exit" \
              --output "suggestion-results/${key}.json"
          done < <(jq -r '.candidates[] | select(.status == "prepared") | .key' prepared.json)
          python3 -B -m fc_review_bot aggregate-suggestions \
            --prepared prepared.json --results-dir suggestion-results --output suggestion-validation.json
      - id: metadata
        env: {PULL_REQUEST: "${{ inputs.pull_request }}", EXPECTED_HEAD: "${{ inputs.expected_head }}"}
        run: echo "artifact_name=fc-live-ai-suggestions-${PULL_REQUEST}-${EXPECTED_HEAD}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            prepared.json
            suggestion-validation.json
            suggestion-results/
            suggestion-logs/
          if-no-files-found: ignore
          retention-days: 14

  finalize:
    name: Final structured artifact and neutral check
    needs: [prepare, validate-ai, deterministic, validate-suggestions]
    if: >-
      ${{ always() && needs.prepare.result == 'success' && needs.validate-ai.result == 'success' &&
          needs.deterministic.result == 'success' && needs.validate-suggestions.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    outputs: {artifact_name: "${{ steps.metadata.outputs.artifact_name }}"}
    steps:
      - id: phase-start
        name: Record finalize start
        run: echo "epoch_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.validate-ai.outputs.artifact_name }}", path: final/ai-evidence}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.deterministic.outputs.artifact_name }}", path: final/deterministic}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.validate-suggestions.outputs.artifact_name }}", path: final/suggestions}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.prepare.outputs.artifact_name }}", path: final/input}
      - name: Publish neutral exact-head check
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          jq -n --arg head "$EXPECTED_HEAD" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{name:"FC live AI advisory review",head_sha:$head,status:"completed",conclusion:"neutral",details_url:$url,output:{title:"Live AI advisory review finalized",summary:"Fresh model evidence and deterministic checks are attached. This is advisory only and has no acceptance effect."}}' > check.json
          gh api --method POST "repos/${OWNER}/${REPOSITORY}/check-runs" --input check.json
      - id: metadata
        env:
          PULL_REQUEST: "${{ inputs.pull_request }}"
          EXPECTED_HEAD: "${{ inputs.expected_head }}"
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
          STARTED_AT_EPOCH_MS: ${{ steps.phase-start.outputs.epoch_ms }}
        run: |
          artifact="fc-live-ai-final-${PULL_REQUEST}-${EXPECTED_HEAD}"
          echo "artifact_name=${artifact}" >> "$GITHUB_OUTPUT"
          python3 -B -m fc_review_bot record-phase \
            --phase finalize --started-at-epoch-ms "$STARTED_AT_EPOCH_MS" \
            --finished-at-epoch-ms "$(date +%s%3N)" --output final/phase-finalize.json
          python3 -B -m fc_review_bot aggregate-cost-ledger \
            --panel final/ai-evidence/ai-review-panel.json \
            --prepare-timing final/input/phase-prepare.json \
            --deterministic-timing final/deterministic/phase-deterministic.json \
            --finalize-timing final/phase-finalize.json --output final/cost-ledger.json
          python3 -B -m fc_review_bot render \
            --panel final/ai-evidence/ai-review-panel.json \
            --deterministic final/deterministic/runtime-deterministic.json \
            --suggestion-validation final/suggestions/suggestion-validation.json \
            --cost-ledger final/cost-ledger.json --phase complete \
            --expected-head "$EXPECTED_HEAD" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact-name "$artifact" --summary final/summary.md --summary-payload final/summary.json \
            --inline-dir final/inline --metadata final/metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "${{ steps.metadata.outputs.artifact_name }}", path: final/, retention-days: 14}

  publish-progress:
    name: Upsert one stable review-in-progress summary
    needs: render-progress
    if: ${{ always() && inputs.publish_comment && needs.render-progress.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.render-progress.outputs.artifact_name }}", path: progress}
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.FC_REVIEW_APP_ID }}
          private-key: ${{ secrets.FC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: read
          permission-pull-requests: write
      - name: Recheck head and upsert summary
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          gh api "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > live-pr.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py verify-head --live-pr live-pr.json \
            --owner "$OWNER" --repository "$REPOSITORY" --pull-request "$PULL_REQUEST" \
            --expected-head "$EXPECTED_HEAD" --output binding.json
          gh api --paginate --slurp "repos/${OWNER}/${REPOSITORY}/issues/${PULL_REQUEST}/comments" > comments.json
          python3 -B -m fc_review_bot select-summary --comments comments.json --app-slug "$APP_SLUG" --output selection.json
          action=$(jq -r .action selection.json); id=$(jq -r '.comment_id // ""' selection.json)
          if [[ "$action" == create ]]; then
            gh api --method POST "repos/${OWNER}/${REPOSITORY}/issues/${PULL_REQUEST}/comments" --input progress/summary.json
          else
            gh api --method PATCH "repos/${OWNER}/${REPOSITORY}/issues/comments/${id}" --input progress/summary.json
          fi

  publish-final:
    name: Finalize stable summary and validated inline findings
    needs: [finalize, publish-progress]
    if: ${{ always() && inputs.publish_comment && needs.finalize.result == 'success' && needs.publish-progress.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: "${{ needs.finalize.outputs.artifact_name }}", path: final}
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.FC_REVIEW_APP_ID }}
          private-key: ${{ secrets.FC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository }}
          permission-contents: read
          permission-pull-requests: write
      - name: Recheck head and update exactly one summary
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PYTHONPATH: reviewer/.agents/fc-review-bot/src
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          gh api "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}" > live-pr.json
          python3 -B reviewer/scripts/prepare_external_pr_comment.py verify-head --live-pr live-pr.json \
            --owner "$OWNER" --repository "$REPOSITORY" --pull-request "$PULL_REQUEST" \
            --expected-head "$EXPECTED_HEAD" --output binding.json
          gh api --paginate --slurp "repos/${OWNER}/${REPOSITORY}/issues/${PULL_REQUEST}/comments" > summary-comments.json
          python3 -B -m fc_review_bot select-summary --comments summary-comments.json --app-slug "$APP_SLUG" --output summary-selection.json
          test "$(jq -r .action summary-selection.json)" = update
          summary_id=$(jq -r .comment_id summary-selection.json)
          gh api --method PATCH "repos/${OWNER}/${REPOSITORY}/issues/comments/${summary_id}" --input final/summary.json
          if [[ "$(jq -r .inline_count final/metadata.json)" -gt 0 ]]; then
            gh api --paginate --slurp "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}/comments" > inline-comments.json
            for request in final/inline/*.json; do
              key=$(basename "$request" .json)
              python3 -B -m fc_review_bot select-inline --comments inline-comments.json \
                --request "$request" --app-slug "$APP_SLUG" --output "inline-selection-${key}.json"
              if [[ "$(jq -r .action "inline-selection-${key}.json")" == create ]]; then
                gh api --method POST "repos/${OWNER}/${REPOSITORY}/pulls/${PULL_REQUEST}/comments" --input "$request"
              else
                inline_id=$(jq -r .comment_id "inline-selection-${key}.json")
                jq '{body}' "$request" > "inline-update-${key}.json"
                gh api --method PATCH "repos/${OWNER}/${REPOSITORY}/pulls/comments/${inline_id}" --input "inline-update-${key}.json"
              fi
            done
          fi
