# One end-to-end run of the review loop on a real pull request: #4884, whose
# claim is that the proof linked from erdos_427 is conditional on Shiu's
# theorem. The loop fetches that proof at its pinned revision, bridges it into
# a generated comparator workspace, and lets comparator say what the axioms
# are. The expected verdict is rejection, for exactly the axiom the PR names;
# the run's own success is the ReviewReport, whichever way comparator rules.
name: Review loop, one real PR

on:
  push:
    branches: [review-loop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point origin/main at upstream main
        run: git fetch https://github.com/google-deepmind/formal-conjectures.git main:refs/remotes/origin/main --force

      - uses: actions/checkout@v4
        with:
          repository: leanprover/comparator
          ref: 71b52ec29e06d4b7d882726553b1ceb99a2499e0
          path: .ci/comparator
      - uses: actions/checkout@v4
        with:
          repository: leanprover/lean4export
          ref: v4.27.0
          path: .ci/lean4export
      - uses: actions/checkout@v4
        with:
          repository: Zouuup/landrun
          ref: 5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          path: .ci/landrun
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build landrun
        working-directory: .ci/landrun
        run: |
          go build -o landrun cmd/landrun/main.go
          echo "$GITHUB_WORKSPACE/.ci/landrun" >> "$GITHUB_PATH"
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build lean4export
        working-directory: .ci/lean4export
        run: lake build lean4export

      - name: Build comparator
        working-directory: .ci/comparator
        run: lake build comparator

      - name: Build the extractor and the problem module
        run: |
          lake exe cache get
          lake build comparator_facts FormalConjectures.ErdosProblems.«427»

      - name: Generate the workspace
        run: python3 scripts/make_comparator_workspace.py erdos_427 --out .comparator

      - name: Ingest the linked proof at its pinned revision
        working-directory: .comparator/erdos_427
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          url = ("https://gist.githubusercontent.com/JohnEdwardJennings/"
                 "e2c6ef0daab55857b7cc9d340de7af84/raw/"
                 "8ff97800e38582c71246a238e7541a9d69488cbd/Erdos427.lean")
          src = urllib.request.urlopen(url).read().decode()
          body = src.replace("import Mathlib\n", "")
          pathlib.Path("Submission/External.lean").write_text(
              "import Mathlib\n\nnamespace External\n\n" + body + "\nend External\n")
          sub = pathlib.Path("Submission.lean")
          t = sub.read_text()
          t = t.replace("import Submission.Helpers",
                        "import Submission.Helpers\nimport Submission.External")
          # 427's answer is decided, `answer(True)`, so the generator hoists
          # no hole and the statement is `True ↔ erdos427`.
          proof = (":= by\n"
                   "  simp only [true_iff]\n"
                   "  intro n d hd\n"
                   "  obtain \u27e8k, hk1, hkdvd\u27e9 := External.erdos427 n d (Nat.one_le_iff_ne_zero.mpr hd)\n"
                   "  refine \u27e8k, Nat.one_le_iff_ne_zero.mp hk1, ?_\u27e9\n"
                   "  rwa [Finset.sum_Ico_eq_sum_range, Nat.add_sub_cancel_left]")
          t = t.replace(":= by\n  sorry", proof)
          sub.write_text(t)
          print(t)
          PY

      - name: Build the workspace
        working-directory: .comparator/erdos_427
        run: |
          lake exe cache get
          lake build

      - name: Run comparator
        id: comparator
        working-directory: .comparator/erdos_427
        continue-on-error: true
        env:
          COMPARATOR_LANDRUN: ${{ github.workspace }}/.ci/landrun/landrun
          COMPARATOR_LEAN4EXPORT: ${{ github.workspace }}/.ci/lean4export/.lake/build/bin/lean4export
        run: |
          set -o pipefail
          systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user --pty --pipe \
            -E PATH="$PATH" -E COMPARATOR_LANDRUN -E COMPARATOR_LEAN4EXPORT \
            --working-directory "$PWD" -- \
            bash -c 'lake env ${{ github.workspace }}/.ci/comparator/.lake/build/bin/comparator config.json' \
            | tee comparator.log

      - name: Assemble the ReviewReport
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          log = pathlib.Path(".comparator/erdos_427/comparator.log").read_text()
          if "solution is okay" in log:
              verdict = "pass"
          elif "could not execute" in log or not log.strip():
              verdict = "error"
          else:
              verdict = "fail"
          report = {
            "schemaVersion": 1,
            "pr": 4884,
            "declaration": "Erdos427.erdos_427",
            "proof": "gist JohnEdwardJennings/e2c6ef…@8ff97800",
            "checks": {
              "generate": "pass",
              "workspaceBuild": "pass",
              "comparator": verdict,
            },
            "comparatorTail": log.strip().splitlines()[-6:],
          }
          out = json.dumps(report, indent=2)
          pathlib.Path("review-report.json").write_text(out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("```json\n" + out + "\n```\n")
          print(out)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: review-report.json
