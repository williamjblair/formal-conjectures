[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-review-bot"
version = "0.1.0"
description = "Exact-head, advisory-only pull-request review evidence engine"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "FC Review Bot Contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23", "PyYAML>=6.0"]

[project.scripts]
fc-review-bot = "fc_review_bot.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
